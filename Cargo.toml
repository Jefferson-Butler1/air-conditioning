[package]
name = "air-conditioning"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Run a Mac's fans at max for a while, then hand them back to macOS"
license = "MIT"
repository = "https://github.com/Jefferson-Butler1/air-conditioning"
keywords = ["macos", "fan", "smc", "apple-silicon", "cooling"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
ctrlc = { version = "3.5", features = ["termination"] }
nix = { version = "0.31", features = ["user"] }
# Pinned exactly: a young single-author crate that runs as root here. Source reviewed at this version.
smc-lib = "=0.1.2"
